---
title: Blog Posts
---
<ul class="post-list">
  {% for post in site.posts %}
  <li><a href="{{ post.url }}">
    <img src="{{ post.image }}" alt="{{ post.image_alt | escape }}" loading="lazy">
    <div>
      <h2>{{ post.title }}</h2>
      <p>{{ post.date | date: "%-d %b %Y" }}</p>
    </div>
  </a></li>
  {% endfor %}
</ul>
