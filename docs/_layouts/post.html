---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="date">{{ page.date | date: "%-d %b %Y" }}</p>
  {% if page.image %}<img class="cover" src="{{ page.image }}" alt="{{ page.image_alt | escape }}">{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="Posts">
    {% if page.next %}<a href="{{ page.next.url }}">‹ {{ page.next.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.previous %}<a href="{{ page.previous.url }}">{{ page.previous.title }} ›</a>{% endif %}
  </nav>
</article>
